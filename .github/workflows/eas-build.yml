name: EAS Build (Android)

# Manual trigger only: every run uses one of the 15 free Android builds per month.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (preview = APK, production = AAB)
        type: choice
        options: [preview, development, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Queue EAS build
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --no-wait
